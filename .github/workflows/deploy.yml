name: Build XeonDB Harbor Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "index.js"
      - "lib/**"
      - "routes/**"
      - "database/**"
      - "views/**"
      - "public/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Build current manifest tag without bumping
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xeondb-harbor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          current=$(grep -m1 -oE 'harbor\.ewenmacculloch\.com/core/xeondb:[0-9]+\.[0-9]+\.[0-9]+' k8s/xeondb.yaml | cut -d: -f2)
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap || 'false' }}" = "true" ]; then
            echo "tag=$current" >> "$GITHUB_OUTPUT"
          else
            IFS=. read -r major minor patch <<< "$current"
            echo "tag=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: harbor.ewenmacculloch.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: harbor.ewenmacculloch.com/core/xeondb:${{ steps.version.outputs.tag }}

  update-manifest:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.bootstrap != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Update manifest tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          perl -0pi -e "s|harbor\.ewenmacculloch\.com/core/xeondb:[^[:space:]]+|harbor.ewenmacculloch.com/core/xeondb:$TAG|g" k8s/xeondb.yaml
          if git diff --quiet -- k8s/xeondb.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/xeondb.yaml
          git commit -m "chore: bump xeondb harbor image [skip ci]"
          git push
