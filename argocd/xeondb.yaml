apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xeondb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/xeondb/website.git
    targetRevision: main
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
