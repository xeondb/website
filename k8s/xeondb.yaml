apiVersion: apps/v1
kind: Deployment
metadata:
  name: xeondb
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xeondb
  template:
    metadata:
      labels:
        app: xeondb
    spec:
      imagePullSecrets:
        - name: harborcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: xeondb
          image: harbor.ewenmacculloch.com/core/xeondb:1.0.1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: xeondb-env
          ports:
            - name: http
              containerPort: 32004
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: xeondb
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: xeondb
  ports:
    - name: http
      port: 32004
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xeondb
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xeondb.com
      secretName: xeondb-tls
  rules:
    - host: xeondb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xeondb
                port:
                  number: 32004
